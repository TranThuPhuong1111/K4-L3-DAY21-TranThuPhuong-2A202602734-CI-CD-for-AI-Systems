name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

# Xac thuc GCP bang Workload Identity Federation (khong dung service account key).
# Org policy cua project chan tao key (iam.disableServiceAccountKeyCreation), nen
# runner doi OIDC token cua GitHub lay access token ngan han cua income-lab-sa.
env:
  ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
  F1_THRESHOLD: "0.65"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Model duoc upload vao artifacts/candidates/<run_id>/ - chi duoc "promote" len
  # artifacts/current/ o job Release, sau khi qua Quality Gate.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # Ghi file credentials tam va set GOOGLE_APPLICATION_CREDENTIALS cho cac step sau
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Pull data with DVC
        # Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv)
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> "$GITHUB_OUTPUT"
          cat outputs/report.json

      - name: Precision / recall report
        # Bonus 3: confusion matrix va precision/recall tung lop (outputs/detail.txt)
        run: |
          cat outputs/detail.txt
          {
            echo "### Ket qua huan luyen"
            echo '```'
            cat outputs/report.json
            echo
            cat outputs/detail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          prefix = f"artifacts/candidates/{os.environ['GITHUB_RUN_ID']}"
          for local, name in [("models/model.joblib", "model.joblib"),
                              ("outputs/report.json", "report.json")]:
              bucket.blob(f"{prefix}/{name}").upload_from_filename(local)
              print(f"Uploaded {local} -> gs://{bucket.name}/{prefix}/{name}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PYEOF'
          import os

          f1 = float(os.environ["F1"])
          threshold = float(os.environ["F1_THRESHOLD"])
          if f1 < threshold:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < {threshold}. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= {threshold}.")
          PYEOF

      - name: Authenticate to Cloud Storage
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Compare with production model
        # Bonus 4: chi trien khai khi F1 moi >= F1 cua model dang chay (artifacts/current/report.json)
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          pip install -q google-cloud-storage==2.16.0
          python - <<'PYEOF'
          import json
          import os
          from google.cloud import storage

          f1_new = float(os.environ["F1"])
          blob = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"]).blob("artifacts/current/report.json")
          if not blob.exists():
              print(f"Chua co model production. F1 moi = {f1_new:.4f} -> trien khai lan dau.")
              raise SystemExit(0)

          f1_old = float(json.loads(blob.download_as_text())["f1_score"])
          print(f"F1 production = {f1_old:.4f} | F1 moi = {f1_new:.4f} | chenh lech = {f1_new - f1_old:+.4f}")
          if f1_new < f1_old:
              raise SystemExit("ROLLBACK GUARD: model moi kem hon model dang chay. Giu nguyen phien ban hien tai.")
          print("PASSED: model moi tot hon hoac bang model dang chay.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Promote model ung vien len artifacts/current/ roi trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Authenticate to Cloud Storage
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Promote model to artifacts/current
        run: |
          pip install -q google-cloud-storage==2.16.0
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket = storage.Client().bucket(os.environ["ARTIFACT_BUCKET"])
          src = f"artifacts/candidates/{os.environ['GITHUB_RUN_ID']}"
          for name in ["model.joblib", "report.json"]:
              bucket.copy_blob(bucket.blob(f"{src}/{name}"), bucket, f"artifacts/current/{name}")
              print(f"Promoted gs://{bucket.name}/{src}/{name} -> artifacts/current/{name}")
          PYEOF

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf http://localhost:8080/healthz; then
                echo
                echo "Health check passed (lan thu $i)."
                exit 0
              fi
              echo "Server chua san sang, thu lai..."
            done
            echo "Health check FAILED."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
